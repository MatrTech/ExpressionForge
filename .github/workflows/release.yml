name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
    paths:
      - 'Directory.Build.props'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    name: Verify version, test and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Only stable MAJOR.MINOR.PATCH versions are released." >&2
            exit 1
          }
          release_tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "$release_tag" ]] || {
              echo "Tag $GITHUB_REF_NAME does not match $release_tag." >&2
              exit 1
            }
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main || {
              echo "Release tag must point to a commit on main." >&2
              exit 1
            }
          else
            [[ "$GITHUB_REF_NAME" == "main" ]] || exit 1
            if gh release view "$release_tag" >/dev/null 2>&1; then
              echo "$release_tag is already published. Bump the version before releasing again." >&2
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
              echo "$release_tag already exists. Use the tag release flow." >&2
              exit 1
            fi
          fi
          echo "RELEASE_VERSION=$release_tag" >> "$GITHUB_ENV"
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ExpressionForge.slnx
      - name: Build (warnings as errors)
        run: dotnet build ExpressionForge.slnx -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test tests/ExpressionForge.Tests/ExpressionForge.Tests.csproj -c Release --no-build
      - name: Test real SQL Server semantics
        run: dotnet test tests/ExpressionForge.IntegrationTests/ExpressionForge.IntegrationTests.csproj -c Release --no-build
      - name: Validate editor JavaScript
        run: |
          node --check src/ExpressionForge.Api/wwwroot/app.js
          node --check src/ExpressionForge.Api/wwwroot/parameter-utils.js
      - name: Test editor parameter bindings
        run: node --test tests/ExpressionForge.Editor.Tests/*.test.cjs
      - name: Test published website examples
        run: |
          node --check site/example-gallery.js
          node --test tests/ExpressionForge.Site.Tests/*.test.cjs
      - name: Pack core library
        run: dotnet pack src/ExpressionForge.Core/ExpressionForge.Core.csproj -c Release --no-build -o artifacts/packages
      - name: Publish API
        run: dotnet publish src/ExpressionForge.Api/ExpressionForge.Api.csproj -c Release --no-restore -o artifacts/api
      - name: Archive API
        run: tar -czf "artifacts/ExpressionForge.Api.${RELEASE_VERSION}.tar.gz" -C artifacts/api .
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=(--generate-notes)
          if [[ -f "docs/releases/$RELEASE_VERSION.md" ]]; then
            notes=(--notes-file "docs/releases/$RELEASE_VERSION.md")
          fi
          tag_args=(--verify-tag)
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            tag_args=(--target "$GITHUB_SHA")
          fi
          gh release create "$RELEASE_VERSION" \
            artifacts/packages/*.nupkg \
            "artifacts/ExpressionForge.Api.${RELEASE_VERSION}.tar.gz" \
            "${tag_args[@]}" "${notes[@]}" --title "ExpressionForge $RELEASE_VERSION"
