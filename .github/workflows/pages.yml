name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/ExpressionForge.Api/wwwroot/**'
      - 'examples/project-catalog.json'
      - 'examples/project-query.json'
      - 'scripts/prepare-blueprint-demo.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish ExpressionForge website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare live Blueprint showcase
        run: node scripts/prepare-blueprint-demo.cjs
      - name: Verify static site
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          node --check site/app.js
          node --check site/example-gallery.js
          node --check site/blueprint-demo.js
          node --check site/blueprint-assets/onboarding.js
          test -s site/blueprint.html
          test -s site/blueprint-assets/graph-preview.js
          node --test tests/ExpressionForge.Site.Tests/*.test.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
