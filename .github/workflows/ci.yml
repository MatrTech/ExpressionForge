name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test and package (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ExpressionForge.slnx
      - name: Build (warnings as errors)
        run: dotnet build ExpressionForge.slnx -c Release --no-restore -warnaserror
      - name: Test (MSTest)
        run: dotnet test tests/ExpressionForge.Tests/ExpressionForge.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Validate editor JavaScript
        run: |
          node --check src/ExpressionForge.Api/wwwroot/app.js
          node --check src/ExpressionForge.Api/wwwroot/parameter-utils.js
          node --check src/ExpressionForge.Api/wwwroot/graph-model.js
          node --check src/ExpressionForge.Api/wwwroot/graph-layout.js
          node --check src/ExpressionForge.Api/wwwroot/graph-edit.js
          node --check src/ExpressionForge.Api/wwwroot/graph-history.js
          node --check src/ExpressionForge.Api/wwwroot/graph-preview.js
      - name: Test editor parameter bindings
        run: node --test tests/ExpressionForge.Editor.Tests/*.test.cjs
      - name: Prepare live Blueprint showcase
        run: node scripts/prepare-blueprint-demo.cjs
      - name: Validate GitHub Pages website
        run: |
          node --check site/blueprint-demo.js
          node --check site/app.js
          node --check site/example-gallery.js
          node --test tests/ExpressionForge.Site.Tests/*.test.cjs
      - name: Pack core library
        run: dotnet pack src/ExpressionForge.Core/ExpressionForge.Core.csproj -c Release --no-build -o artifacts/packages
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload package candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: expressionforge-package-${{ github.sha }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14


  browser-acceptance:
    name: Chromium Blueprint acceptance (site + .NET API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Prepare Blueprint static demo
        run: node scripts/prepare-blueprint-demo.cjs
      - name: Start static website and .NET API
        run: |
          python3 -m http.server 5085 --bind 127.0.0.1 --directory site >/tmp/ef-site.log 2>&1 &
          dotnet run --project src/ExpressionForge.Api --urls http://127.0.0.1:5054 >/tmp/ef-api.log 2>&1 &
          node - <<'NODE'
          const targets = ['http://127.0.0.1:5085/blueprint.html', 'http://127.0.0.1:5054/api/query/catalogs'];
          (async () => {
            for (const target of targets) {
              let ready = false;
              for (let attempt = 0; attempt < 90; attempt++) {
                try { if ((await fetch(target)).ok) { ready = true; break; } } catch {}
                await new Promise(resolve => setTimeout(resolve, 1000));
              }
              if (!ready) throw Error('Server did not boot: ' + target);
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Exercise live Blueprint interactions in Chromium
        run: node --test tests/ExpressionForge.Browser.Tests/*.test.cjs
      - name: Show browser service logs on failure
        if: failure()
        run: |
          tail -120 /tmp/ef-site.log || true
          tail -120 /tmp/ef-api.log || true

  sqlserver-integration:
    name: SQL Server 2022 integration (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test real SQL Server semantics
        run: dotnet test tests/ExpressionForge.IntegrationTests/ExpressionForge.IntegrationTests.csproj -c Release --logger "trx;LogFileName=integration.trx" --results-directory TestResults
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlserver-integration-${{ github.run_id }}
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  application-artifact:
    name: Publish API artifact (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish framework-dependent API
        run: dotnet publish src/ExpressionForge.Api/ExpressionForge.Api.csproj -c Release -o artifacts/api
      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: expressionforge-api-${{ github.sha }}
          path: artifacts/api/
          if-no-files-found: error
          retention-days: 14
